<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gincana Escolar — Provas</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#fff; --ink:#1c2030; --muted:#6b7085; --line:#e3e6ef;
    --accent:#4f46e5; --accent-soft:#eef0ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
  header{background:var(--ink);color:#fff;padding:20px 16px 14px}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}
  header .wrap{padding:0}
  h1{margin:0;font-size:1.6rem}
  .sub{color:#b9bdd0;font-size:.9rem;margin-top:4px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  a{color:var(--accent)}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:.9rem}
  .btn:hover{border-color:var(--accent)}
  .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.dan{color:#b91c1c}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.sm{padding:3px 8px;font-size:.8rem}
  header .btn{background:transparent;color:#fff;border-color:#4a4f66}
  nav.tabs{display:flex;gap:6px;margin:16px 0 10px;flex-wrap:wrap}
  nav.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;color:var(--muted)}
  nav.tabs button.on{background:var(--accent);color:#fff}
  nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:#f59e0b;color:#fff;font-size:.72rem;line-height:18px;text-align:center}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
  textarea{width:100%;min-height:60px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .prova-nome{font-weight:600;font-size:1.02rem}
  .desc{color:var(--muted);font-size:.9rem;margin:4px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
  .meta{font-size:.8rem;color:var(--muted)}
  ul.at{list-style:none;padding:0;margin:8px 0 0}
  ul.at li{padding:5px 0;border-top:1px dashed var(--line);font-size:.92rem}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;padding:2px 9px;border-radius:99px;white-space:nowrap}
  .chip input{margin:0}
  label.chip{cursor:pointer}
  .c-ok{background:#e3f6e9;color:#155f30} .c-no{background:#fdeaea;color:#9b1c1c}
  .c-novo{background:#fff1d6;color:#7a5200} .c-neutro{background:#eef0f4;color:#4b5063}
  .ctrl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .links{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;margin-top:6px}
  .legenda{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem;margin:8px 0;max-height:7.5em;overflow:hidden;cursor:pointer;position:relative}
  .legenda.longa:not(.aberta)::after{content:"ver mais";position:absolute;right:0;bottom:0;background:linear-gradient(90deg,transparent,#fff 30%);padding-left:30px;color:var(--accent);font-size:.8rem}
  .legenda.aberta{max-height:none}
  .empty{color:var(--muted);text-align:center;padding:30px}
  .admin-panel{background:var(--accent-soft);border:1px solid #d6d9ff;border-radius:12px;padding:14px;margin-bottom:14px}
  .admin-panel h3{margin:0 0 8px;font-size:1rem}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .row > *{flex:1 1 160px}
  .row > .btn{flex:0 0 auto}
  .row label.ck{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:.9rem}
  .pill-list{display:flex;flex-wrap:wrap;gap:6px}
  .pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 6px 3px 10px;font-size:.85rem;display:flex;align-items:center;gap:6px}
  .pill button{border:0;background:transparent;cursor:pointer;color:#b91c1c;font-size:1rem;line-height:1}
  .pessoas{min-height:42px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:6px}
  .warn{background:#fff7e6;border:1px solid #f5d28a;color:#7a5200;padding:8px 12px;border-radius:8px;font-size:.88rem;margin-bottom:12px}
  dialog{border:0;border-radius:14px;padding:18px;max-width:560px;width:94vw}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  .lbl{font-size:.8rem;color:var(--muted);margin:2px 0 4px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:top}
  th{background:#fafbff;color:var(--muted);font-weight:600}
  footer{color:var(--muted);font-size:.8rem;text-align:center;padding:30px 0}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div>
      <h1 id="titulo">Gincana Escolar</h1>
      <div class="sub" id="atualizado">Carregando…</div>
    </div>
    <button class="btn" id="btnAdmin">Modo organizador</button>
  </div>
</header>

<main class="wrap">
  <div id="aviso"></div>
  <div id="admin" hidden></div>

  <nav class="tabs">
    <button data-tab="provas" class="on">Provas</button>
    <button data-tab="postagens">Postagens da gincana<span id="badgePost"></span></button>
    <button data-tab="alunos">Por aluno</button>
  </nav>

  <div class="bar">
    <input id="busca" placeholder="Buscar prova ou pessoa…" style="flex:1 1 220px">
    <select id="fCtrl">
      <option value="">Todas as provas</option>
      <option value="falta-enviar">Falta enviar</option>
      <option value="falta-postar">Falta postar no Instagram</option>
      <option value="completas">Enviadas e postadas</option>
    </select>
  </div>

  <section id="view"></section>
</main>
<footer>Site da gincana · publicado no GitHub Pages</footer>

<dialog id="dlg"></dialog>

<script>
const LS_DRAFT = "gincana_rascunho", LS_CFG = "gincana_github";
let D = null, publicado = null, admin = false, tab = "provas";
let IG = {conta: "gincanamartinholutero", atualizado: "", postagens: []};  // preenchido pelo robô (instagram.json)

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8);
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch(e) {} };

const fmtData = s => s ? new Date(s + "T12:00").toLocaleDateString("pt-BR") : "";
const fmtDataHora = s => s ? new Date(s).toLocaleString("pt-BR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}) : "";
const limpaNome = s => String(s || "").replace(/\s+/g, " ").trim();
const chaveNome = s => limpaNome(s).toLowerCase();
const urlSegura = u => /^https?:\/\//i.test(String(u || "").trim()) ? String(u).trim() : "";
// Código da postagem no link do Instagram (…/p/CODIGO/, …/reel/CODIGO/), para comparar links
const codigoPost = u => (String(u || "").match(/instagram\.com\/(?:[^/?#]+\/)?(?:p|reels?|tv)\/([A-Za-z0-9_-]+)/) || [])[1] || "";
const TIPO = {IMAGE: "Foto", VIDEO: "Vídeo", CAROUSEL_ALBUM: "Carrossel"};

/* Garante o formato atual dos dados. Converte dados antigos (atribuicoes/categorias), por exemplo num rascunho salvo. */
function normaliza(d){
  d = d && typeof d === "object" ? d : {};
  const alunos = Array.isArray(d.alunos) ? d.alunos.filter(a => a && limpaNome(a.nome)) : [];
  const nomePorId = Object.fromEntries(alunos.map(a => [a.id, a.nome]));
  const provas = (Array.isArray(d.provas) ? d.provas : []).map(p => {
    const brutos = Array.isArray(p.pessoas) ? p.pessoas
      : (p.atribuicoes || []).map(a => nomePorId[a.alunoId]);
    const vistos = new Set(), pessoas = [];
    for (const n of brutos.map(limpaNome)) if (n && !vistos.has(n.toLowerCase())) { vistos.add(n.toLowerCase()); pessoas.push(n); }
    return {id: p.id || uid("p"), nome: limpaNome(p.nome), descricao: p.descricao || "", prazo: p.prazo || "", pessoas,
      postGincana: p.postGincana || "", nossoPost: p.nossoPost || "", enviada: !!p.enviada, postada: !!p.postada};
  });
  const ignorados = Array.isArray(d.ignorados) ? d.ignorados.map(String) : [];
  return {titulo: d.titulo || "Gincana Escolar", atualizado: d.atualizado || "", alunos, provas, ignorados};
}

async function pegaJson(arq){
  try { const r = await fetch(arq + "?t=" + Date.now(), {cache:"no-store"}); return r.ok ? await r.json() : null; }
  catch(e) { return null; }
}

async function carregar(){
  const [dados, ig] = await Promise.all([pegaJson("data.json"), pegaJson("instagram.json")]);
  publicado = normaliza(dados);
  if (ig && Array.isArray(ig.postagens)) IG = {...IG, ...ig};
  IG.postagens.sort((a, b) => String(b.data).localeCompare(String(a.data)));
  D = structuredClone(publicado);
  admin = new URLSearchParams(location.search).has("admin") || lsGet("gincana_admin") === "1";
  if (admin) carregarRascunho();
  render();
}

function carregarRascunho(){ const r = lsGet(LS_DRAFT); if (r) { try { D = normaliza(JSON.parse(r)); } catch(e){} } }
function salvarRascunho(){ lsSet(LS_DRAFT, JSON.stringify(D)); render(); }
function temRascunho(){ return JSON.stringify(D) !== JSON.stringify(publicado); }

/* Nomes para o autocompletar: cadastro + nomes já usados em provas */
function nomesConhecidos(){
  const m = new Map();
  for (const n of [...D.alunos.map(a => a.nome), ...D.provas.flatMap(p => p.pessoas)]) {
    const k = chaveNome(n); if (k && !m.has(k)) m.set(k, limpaNome(n));
  }
  return [...m.values()].sort((a, b) => a.localeCompare(b, "pt-BR"));
}

/* Postagens da gincana: qual prova veio de cada uma, e quais ainda não viraram prova */
const provaDoPost = post => { const c = codigoPost(post.link); return c ? D.provas.find(p => codigoPost(p.postGincana) === c) : null; };
const postIgnorado = post => D.ignorados.includes(String(post.id));
const postsPendentes = () => IG.postagens.filter(post => !provaDoPost(post) && !postIgnorado(post));

/* ---------------- Visualização ---------------- */
function render(){
  document.title = (D.titulo || "Gincana") + " — Provas";
  $("#titulo").textContent = D.titulo || "Gincana Escolar";
  $("#atualizado").textContent = D.atualizado ? "Atualizado em " + new Date(D.atualizado).toLocaleString("pt-BR") : "Lista de provas e responsáveis";
  $("#btnAdmin").textContent = admin ? "Sair do modo organizador" : "Modo organizador";

  const pend = postsPendentes().length;
  $("#badgePost").innerHTML = pend ? `<span class="badge">${pend}</span>` : "";
  $("#aviso").innerHTML =
    (admin && temRascunho() ? `<div class="warn">Você tem alterações <b>não publicadas</b>. Os outros ainda veem a versão antiga. Clique em <b>Publicar</b> no painel abaixo.</div>` : "") +
    (pend ? `<div class="warn">📣 ${pend === 1 ? "1 postagem da gincana ainda não virou prova" : pend + " postagens da gincana ainda não viraram prova"} no site. <a href="#" data-goto="postagens">Ver postagens</a></div>` : "");

  $("#admin").hidden = !admin;
  if (admin) renderAdmin();

  renderView();
}

/* Só a lista da aba atual: usado pela busca, filtro e abas, para não redesenhar o painel do organizador */
function renderView(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("#fCtrl").hidden = tab !== "provas";
  $("#busca").placeholder = tab === "postagens" ? "Buscar na legenda das postagens…" : "Buscar prova ou pessoa…";
  ({provas:viewProvas, postagens:viewPostagens, alunos:viewAlunos})[tab]();
  marcaLegendasLongas();
}

const busca = () => $("#busca").value.trim().toLowerCase();

function ctrlProva(p){
  const item = (campo, sim, nao) => admin
    ? `<label class="chip ${p[campo] ? "c-ok" : "c-no"}"><input type="checkbox" data-tg="${campo}|${p.id}" ${p[campo] ? "checked" : ""}>${p[campo] ? sim : nao}</label>`
    : `<span class="chip ${p[campo] ? "c-ok" : "c-no"}">${p[campo] ? "✔ " + sim : "✗ " + nao}</span>`;
  const lg = urlSegura(p.postGincana), ln = urlSegura(p.nossoPost);
  return `<div class="ctrl">${item("enviada", "Enviada", "Falta enviar")}${item("postada", "Postada no Instagram", "Falta postar")}</div>
    ${lg || ln ? `<div class="links">${lg ? `<a href="${esc(lg)}" target="_blank" rel="noopener">Postagem da gincana ↗</a>` : ""}${ln ? `<a href="${esc(ln)}" target="_blank" rel="noopener">Nosso post ↗</a>` : ""}</div>` : ""}`;
}

function cardProva(p){
  const n = p.pessoas.length;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;gap:8px">
      <div class="prova-nome">${esc(p.nome)}</div>
      ${admin ? `<div style="white-space:nowrap"><button class="btn sm" data-edit="${p.id}">Editar</button></div>` : ""}
    </div>
    ${p.descricao ? `<div class="desc">${esc(p.descricao)}</div>` : ""}
    <div class="meta">${p.prazo ? "Prazo: " + fmtData(p.prazo) + " · " : ""}${n} pessoa${n === 1 ? "" : "s"}</div>
    ${n ? `<ul class="at">${p.pessoas.map(nome => `<li>${esc(nome)}</li>`).join("")}</ul>` : `<div class="meta" style="margin-top:6px">Ninguém nesta prova ainda.</div>`}
    ${ctrlProva(p)}
  </div>`;
}

function viewProvas(){
  const q = busca(), fc = $("#fCtrl").value;
  const ps = D.provas.filter(p =>
    (!q || (p.nome + " " + p.descricao + " " + p.pessoas.join(" ")).toLowerCase().includes(q)) &&
    (fc !== "falta-enviar" || !p.enviada) && (fc !== "falta-postar" || !p.postada) && (fc !== "completas" || (p.enviada && p.postada)));
  const tot = D.provas.length;
  const resumo = tot ? `<div class="meta" style="margin-bottom:10px">${tot} prova${tot > 1 ? "s" : ""} · enviadas: ${D.provas.filter(p => p.enviada).length}/${tot} · postadas no Instagram: ${D.provas.filter(p => p.postada).length}/${tot}</div>` : "";
  $("#view").innerHTML = resumo + (ps.length
    ? `<div class="grid">${ps.map(cardProva).join("")}</div>`
    : `<div class="empty">${tot ? "Nenhuma prova encontrada." : "Nenhuma prova cadastrada ainda."}</div>`);
}

function viewPostagens(){
  const q = busca(), perfil = `https://www.instagram.com/${encodeURIComponent(IG.conta)}/`;
  const topo = `<div class="meta" style="margin-bottom:10px">Acompanhando <a href="${perfil}" target="_blank" rel="noopener">@${esc(IG.conta)}</a>
    ${IG.atualizado ? ` · última novidade registrada em ${fmtDataHora(IG.atualizado)}` : ""}
    ${admin && postsPendentes().length ? ` · <button class="btn sm" id="ignTodas">Marcar todas as pendentes como "não é prova"</button>` : ""}</div>`;
  if (!IG.postagens.length) {
    $("#view").innerHTML = topo + `<div class="empty">Nenhuma postagem carregada ainda.<br>O robô que acompanha o Instagram da gincana ainda não rodou ou não foi configurado (veja o README do repositório).</div>`;
    return;
  }
  const lista = IG.postagens.filter(post => !q || String(post.legenda || "").toLowerCase().includes(q));
  const card = post => {
    const prova = provaDoPost(post), ign = !prova && postIgnorado(post);
    const status = prova ? `<span class="chip c-ok">Prova: ${esc(prova.nome)}</span>`
      : ign ? `<span class="chip c-neutro">Não é prova</span>` : `<span class="chip c-novo">Nova · ainda não virou prova</span>`;
    const link = urlSegura(post.link);
    const acoes = !admin ? "" : prova ? `<button class="btn sm" data-edit="${prova.id}">Editar prova</button>`
      : `<button class="btn sm pri" data-criar="${esc(post.id)}">Criar prova</button>
         <button class="btn sm" data-ign="${esc(post.id)}">${ign ? "Voltar a mostrar" : "Não é prova"}</button>`;
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="meta">${fmtDataHora(post.data)}${TIPO[post.tipo] ? " · " + TIPO[post.tipo] : ""}</span>${status}
      </div>
      ${post.legenda ? `<div class="legenda">${esc(post.legenda)}</div>` : `<div class="meta" style="margin:8px 0">(sem legenda)</div>`}
      <div class="links" style="align-items:center">${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Ver no Instagram ↗</a>` : ""}${acoes}</div>
    </div>`;
  };
  $("#view").innerHTML = topo + (lista.length ? `<div class="grid">${lista.map(card).join("")}</div>` : `<div class="empty">Nenhuma postagem encontrada.</div>`);
}

function marcaLegendasLongas(){
  document.querySelectorAll(".legenda").forEach(el => el.classList.toggle("longa", el.scrollHeight > el.clientHeight + 2));
}

function viewAlunos(){
  const q = busca();
  const grupos = new Map();   // chave do nome -> {nome, provas:[]}
  const grupo = n => { const k = chaveNome(n); if (!grupos.has(k)) grupos.set(k, {nome: limpaNome(n), provas: []}); return grupos.get(k); };
  D.alunos.forEach(a => grupo(a.nome));
  D.provas.forEach(p => p.pessoas.forEach(n => grupo(n).provas.push(p)));
  const linhas = [...grupos.values()]
    .sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"))
    .filter(g => !q || (g.nome + " " + g.provas.map(p => p.nome).join(" ")).toLowerCase().includes(q))
    .map(g => `<tr>
      <td><b>${esc(g.nome)}</b></td>
      <td>${g.provas.length ? g.provas.map(p => `<div style="margin:3px 0">${esc(p.nome)}${p.prazo ? ` <span class="meta">· prazo ${fmtData(p.prazo)}</span>` : ""}</div>`).join("") : `<span class="meta">Sem provas</span>`}</td>
    </tr>`);
  $("#view").innerHTML = linhas.length
    ? `<table><thead><tr><th style="width:30%">Aluno</th><th>Provas</th></tr></thead><tbody>${linhas.join("")}</tbody></table>`
    : `<div class="empty">Nenhum aluno encontrado.</div>`;
}

/* ---------------- Modo organizador ---------------- */
const CAMPOS_PAINEL = ["aAlunos","gOwner","gRepo","gToken"];
function renderAdmin(){
  const cfg = JSON.parse(lsGet(LS_CFG) || "{}");
  const digitado = {};
  for (const id of CAMPOS_PAINEL) { const el = document.getElementById(id); if (el) digitado[id] = el.value; }
  const det = $("#admin details"), detAberto = det ? det.open : null;
  $("#admin").innerHTML = `
  <div class="admin-panel">
    <h3>Painel do organizador</h3>
    <div class="row">
      <input id="aTitulo" value="${esc(D.titulo)}" placeholder="Nome da gincana">
      <button class="btn" id="aSalvaTit">Salvar nome</button>
      <button class="btn pri" id="aNovaProva">+ Nova prova</button>
    </div>

    <div class="row"><b style="flex:0 0 auto">Alunos (sugestões):</b>
      <textarea id="aAlunos" placeholder="Um nome por linha (opcional)" title="Esses nomes aparecem como sugestão ao montar as provas." style="min-height:38px"></textarea>
      <button class="btn" id="aAddAl">Adicionar</button></div>
    <div class="pill-list" style="margin-bottom:12px">${D.alunos.map(a => `<span class="pill">${esc(a.nome)}<button title="Remover das sugestões" data-delal="${a.id}">×</button></span>`).join("") || '<span class="meta">Nenhum. Você também pode digitar qualquer nome direto na prova.</span>'}</div>

    <details ${cfg.token ? "" : "open"} style="margin-top:6px">
      <summary><b>Publicar para todos</b> ${cfg.token ? '<span class="meta">(GitHub configurado)</span>' : ""}</summary>
      <p class="meta">As alterações ficam salvas só neste navegador até você publicar. Publicar grava o arquivo <code>data.json</code> no repositório do GitHub; o site atualiza para todos em cerca de 1 minuto.</p>
      <div class="row">
        <input id="gOwner" placeholder="Usuário do GitHub" value="${esc(cfg.owner || guessOwner())}">
        <input id="gRepo" placeholder="Repositório" value="${esc(cfg.repo || guessRepo())}">
        <input id="gToken" type="password" placeholder="Token de acesso (fica só neste navegador)" value="${esc(cfg.token || "")}">
      </div>
    </details>
    <div class="row" style="margin-top:8px">
      <button class="btn pri" id="gPub" ${temRascunho() ? "" : "disabled"}>Publicar</button>
      <button class="btn" id="gBaixar">Baixar data.json</button>
      <button class="btn dan" id="gDesc" ${temRascunho() ? "" : "disabled"}>Descartar alterações</button>
      <span id="gMsg" class="meta"></span>
    </div>
  </div>`;
  for (const id in digitado) document.getElementById(id).value = digitado[id];
  if (detAberto !== null) $("#admin details").open = detAberto;
}

function guessOwner(){ return location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : ""; }
function guessRepo(){
  if (!location.hostname.endsWith(".github.io")) return "";
  const seg = location.pathname.split("/").filter(Boolean)[0];
  return seg && !seg.includes(".") ? seg : location.hostname;
}

/* Prova nova a partir de uma postagem da gincana: nome = 1ª linha da legenda, descrição = legenda inteira */
function provaDaPostagem(post){
  const leg = String(post.legenda || "").trim();
  let nome = leg.split("\n").map(s => s.trim()).find(Boolean) || "Prova";
  if (nome.length > 80) nome = nome.slice(0, 79).trimEnd() + "…";
  return {nome, descricao: leg, postGincana: post.link || ""};
}

function dlgProva(id, base){
  const vazio = {id:"", nome:"", descricao:"", prazo:"", pessoas:[], postGincana:"", nossoPost:"", enviada:false, postada:false};
  const p = id ? D.provas.find(x => x.id === id) : {...vazio, ...(base || {})};
  const pessoas = [...p.pessoas];
  const d = $("#dlg");
  d.innerHTML = `<h3 style="margin-top:0">${id ? "Editar prova" : "Nova prova"}</h3>
    <div class="row"><input id="pNome" placeholder="Nome da prova" value="${esc(p.nome)}"></div>
    <div class="row"><input id="pPrazo" type="date" value="${esc(p.prazo)}" title="Prazo (opcional)" style="flex:0 1 200px"><span class="meta">Prazo (opcional)</span></div>
    <div class="row"><textarea id="pDesc" placeholder="Descrição / regras (opcional)">${esc(p.descricao)}</textarea></div>
    <div class="lbl">Quem vai fazer esta prova (digite qualquer nome e aperte Enter):</div>
    <div class="row" style="margin-bottom:0">
      <input id="pPessoa" list="pSugestoes" placeholder="Nome da pessoa" autocomplete="off">
      <button class="btn" id="pAddPessoa">Adicionar</button>
    </div>
    <datalist id="pSugestoes"></datalist>
    <div class="pessoas pill-list" id="pPessoas"></div>
    <div class="lbl" style="margin-top:12px">Controle:</div>
    <div class="row">
      <label class="ck"><input type="checkbox" id="pEnv" ${p.enviada ? "checked" : ""}> Enviada</label>
      <label class="ck"><input type="checkbox" id="pPos" ${p.postada ? "checked" : ""}> Postada no Instagram</label>
    </div>
    <div class="row"><input id="pNosso" placeholder="Link do nosso post no Instagram (opcional)" value="${esc(p.nossoPost)}"></div>
    <div class="row"><input id="pPostG" placeholder="Link da postagem da gincana com esta prova (opcional)" value="${esc(p.postGincana)}"></div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      ${id ? `<button class="btn dan" id="pDel">Excluir prova</button>` : "<span></span>"}
      <span style="display:flex;gap:8px;flex:0 0 auto"><button class="btn" id="pCancel">Cancelar</button><button class="btn pri" id="pOk">Salvar</button></span>
    </div>`;

  const desenhaPessoas = () => {
    $("#pPessoas").innerHTML = pessoas.map((n, i) => `<span class="pill">${esc(n)}<button type="button" title="Tirar da prova" data-rmp="${i}">×</button></span>`).join("")
      || '<span class="meta">Ninguém ainda.</span>';
    const ja = new Set(pessoas.map(chaveNome));
    $("#pSugestoes").innerHTML = nomesConhecidos().filter(n => !ja.has(chaveNome(n))).map(n => `<option value="${esc(n)}">`).join("");
  };
  // Aceita um nome ou vários separados por vírgula, ponto e vírgula ou quebra de linha
  const adicionaDigitado = () => {
    const inp = $("#pPessoa");
    for (const n of inp.value.split(/[,;\n]/).map(limpaNome).filter(Boolean))
      if (!pessoas.some(x => chaveNome(x) === chaveNome(n))) pessoas.push(n);
    inp.value = ""; desenhaPessoas();
  };
  desenhaPessoas();
  d.showModal();

  $("#pPessoa").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); adicionaDigitado(); } };
  $("#pPessoa").onpaste = e => {
    const txt = (e.clipboardData || window.clipboardData)?.getData("text") || "";
    if (/[\n,;]/.test(txt)) { e.preventDefault(); $("#pPessoa").value = txt; adicionaDigitado(); }
  };
  $("#pAddPessoa").onclick = () => { adicionaDigitado(); $("#pPessoa").focus(); };
  $("#pPessoas").onclick = e => { const i = e.target.dataset?.rmp; if (i !== undefined) { pessoas.splice(+i, 1); desenhaPessoas(); } };
  $("#pCancel").onclick = () => d.close();
  if (id) $("#pDel").onclick = () => { if (confirm("Excluir esta prova?")) { D.provas = D.provas.filter(x => x.id !== id); d.close(); salvarRascunho(); } };
  $("#pOk").onclick = () => {
    const nome = limpaNome($("#pNome").value); if (!nome) { $("#pNome").focus(); return; }
    adicionaDigitado(); // não perde um nome digitado sem apertar Enter
    const novo = {id: p.id || uid("p"), nome, descricao: $("#pDesc").value.trim(), prazo: $("#pPrazo").value, pessoas: [...pessoas],
      postGincana: $("#pPostG").value.trim(), nossoPost: $("#pNosso").value.trim(), enviada: $("#pEnv").checked, postada: $("#pPos").checked};
    if (id) D.provas[D.provas.findIndex(x => x.id === id)] = novo; else D.provas.push(novo);
    d.close(); salvarRascunho();
  };
}

async function publicar(){
  const owner = $("#gOwner").value.trim(), repo = $("#gRepo").value.trim(), token = $("#gToken").value.trim();
  const msg = $("#gMsg");
  if (!owner || !repo || !token) { msg.textContent = "Preencha usuário, repositório e token."; $("#admin details").open = true; return; }
  lsSet(LS_CFG, JSON.stringify({owner, repo, token}));
  msg.textContent = "Publicando…";
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/data.json`;
  const h = {Authorization: "Bearer " + token, Accept: "application/vnd.github+json"};
  try {
    const cur = await fetch(url, {headers: h, cache: "no-store"});
    const sha = cur.ok ? (await cur.json()).sha : undefined;
    const dados = {...D, atualizado: new Date().toISOString()};
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(dados, null, 2))));
    const r = await fetch(url, {method: "PUT", headers: h, body: JSON.stringify({message: "Atualiza provas da gincana", content, sha})});
    if (!r.ok) throw new Error((await r.json()).message || r.status);
    D = dados; publicado = structuredClone(dados); lsDel(LS_DRAFT); render();
    $("#gMsg").textContent = "Publicado! O site atualiza para todos em ~1 minuto.";
  } catch(e) {
    msg.textContent = "Erro ao publicar: " + e.message + " (confira o token e o nome do repositório)";
  }
}

function baixar(){
  const b = new Blob([JSON.stringify({...D, atualizado: new Date().toISOString()}, null, 2)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "data.json"; a.click();
}

/* ---------------- Eventos ---------------- */
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("nav.tabs button")) { tab = t.closest("button").dataset.tab; renderView(); return; }
  if (t.dataset.goto) { e.preventDefault(); tab = t.dataset.goto; renderView(); $("nav.tabs").scrollIntoView({behavior: "smooth"}); return; }
  if (t.classList.contains("legenda")) { t.classList.toggle("aberta"); return; }
  if (t.id === "btnAdmin") {
    admin = !admin; lsSet("gincana_admin", admin ? "1" : "0");
    if (admin) carregarRascunho(); else D = structuredClone(publicado);
    render(); return;
  }
  if (!admin) return;
  if (t.dataset.edit) return dlgProva(t.dataset.edit);
  if (t.dataset.criar) { const post = IG.postagens.find(x => String(x.id) === t.dataset.criar); if (post) dlgProva(null, provaDaPostagem(post)); return; }
  if (t.dataset.ign) {
    const k = t.dataset.ign;
    D.ignorados = D.ignorados.includes(k) ? D.ignorados.filter(x => x !== k) : [...D.ignorados, k];
    return salvarRascunho();
  }
  if (t.id === "ignTodas") {
    if (confirm("Marcar todas as postagens pendentes como \"não é prova\"? Dá para desfazer uma por uma depois.")) {
      D.ignorados = [...new Set([...D.ignorados, ...postsPendentes().map(p => String(p.id))])];
      salvarRascunho();
    }
    return;
  }
  if (t.id === "aNovaProva") return dlgProva(null);
  if (t.id === "aSalvaTit") { D.titulo = $("#aTitulo").value.trim() || "Gincana Escolar"; return salvarRascunho(); }
  if (t.id === "aAddAl") {
    const ja = new Set(D.alunos.map(a => chaveNome(a.nome)));
    $("#aAlunos").value.split(/\n/).map(limpaNome).filter(Boolean).forEach(n => {
      if (!ja.has(chaveNome(n))) { ja.add(chaveNome(n)); D.alunos.push({id: uid("a"), nome: n}); }
    });
    $("#aAlunos").value = "";
    return salvarRascunho();
  }
  if (t.dataset.delal) {
    if (confirm("Remover este nome das sugestões? As provas em que ele já está não mudam.")) {
      D.alunos = D.alunos.filter(a => a.id !== t.dataset.delal);
      salvarRascunho();
    }
    return;
  }
  if (t.id === "gPub") return publicar();
  if (t.id === "gBaixar") return baixar();
  if (t.id === "gDesc") { if (confirm("Descartar tudo que não foi publicado?")) { D = structuredClone(publicado); lsDel(LS_DRAFT); render(); } }
});
document.addEventListener("change", e => {
  const tg = e.target.dataset?.tg; if (!tg || !admin) return;
  const [campo, pid] = tg.split("|");
  const p = D.provas.find(x => x.id === pid);
  if (p && (campo === "enviada" || campo === "postada")) { p[campo] = e.target.checked; salvarRascunho(); }
});
$("#busca").addEventListener("input", () => renderView());
$("#fCtrl").addEventListener("input", () => renderView());
window.addEventListener("resize", marcaLegendasLongas);

carregar();
</script>
